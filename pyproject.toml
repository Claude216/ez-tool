[project]
name = "ez-tool"
version = "0.1.0"
description = "Tool-selection methods evaluated on StableToolBench"
requires-python = ">=3.11"
dependencies = [
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "numpy>=1.26",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Phase 2 only. Not installed by default -- phase 1 is CPU/LLM-free.
llm = ["vllm>=0.28.0", "openai>=1.40"]
dev = ["pytest>=8.0"]
# Figures for the section 7 text-mining replication.
viz = ["matplotlib>=3.8"]

[project.scripts]
ez-tool = "ez_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ez_tool"]
