# Zero-shot PRF-CNB against BM25 on ToolBench's retrieval split.
#
# Same data and metric as configs/toolbench_replication.yaml; the retrievers
# are our tuned BM25 (the bar) and the best PRF-CNB config found on
# StableToolBench. ToolGen's own stack is not re-run here -- see that config.
#
# Runs on ToolBench's retrieval split -- NOT StableToolBench's solvable
# queries. Everything here is pinned to what their code actually does
# (evaluation/retrieval/eval_bm25.py, evaluation/utils/retrieval.py):
#
#   documents  category_name, tool_name, api_name, api_description,
#              required_params/optional_params/return_schema as raw json.dumps
#   retriever  rank_bm25.BM25Okapi over nltk.word_tokenize(lower()),
#              no stemming, no stopword removal
#   metric     NDCG@1/3/5 with IDCG taken over the relevant docs actually
#              retrieved (ndcg_toolgen), which is how their compute_ndcg builds
#              `true_relevance`
#   top_n      100

run_name: toolbench_cnb_prf

data_root: /mnt/beegfs/lli66/ez-tool/data/raw/toolgen_data/data/retrieval

# in_domain ranks within one stage's corpus; multi_domain ranks over the
# pooled 49,936-doc corpus. ToolGen reports both.
settings:
  - multi_domain
  - in_domain

retrievers:
  - name: bm25s_ours # the bar: our tuned BM25 on their data
    type: bm25
    method: lucene
    k1: 1.5
    b: 0.75
    stemmer: true
    stopwords: en
  - name: cnb_prf_best # best zero-shot PRF config from the StableToolBench sweep
    type: cnb_prf
    pool: 100
    n_pos: 1
    n_neg: 200
    top_features: 5000
    norm: false
    fusion: rrf
    score: margin
    k_rrf: 60.0
    seed: 1

top_k: 100
ks: [1, 3, 5]

splits:
  - [G1, instruction]
  - [G1, tool]
  - [G1, category]
  - [G2, instruction]
  - [G2, category]
  - [G3, instruction]
