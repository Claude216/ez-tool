# Why does punctuation hurt: length inflation, or rank_bm25's epsilon floor?
#
# BM25Okapi computes idf = log((N-df+0.5)/(df+0.5)), negative for any term in
# more than half the documents, then REPLACES those with epsilon*average_idf --
# a positive weight. So commas and braces score points instead of being
# ignored, and natural-language queries carry their own punctuation.
#
# epsilon=0 zeroes those terms' score contribution while leaving them in the
# document-length denominator. Reference points, all I1 NDCG@5, same settings:
#   nltk, epsilon=0.25            26.22
#   nltk minus punctuation        37.55
#   regex tokens                  39.06
#
# -> lands near 37.5 : the epsilon floor was the problem (scoring noise)
# -> stays near 26.2 : length inflation was the problem
run_name: toolbench_epsilon
data_root: /mnt/beegfs/lli66/ez-tool/data/raw/toolgen_data/data/retrieval
settings: [multi_domain]
retrievers:
  - name: E_nltk_epsilon_zero
    type: bm25_okapi
    k1: 1.5
    b: 0.75
    epsilon: 0.0
    tokenizer: nltk
top_k: 100
ks: [1, 3, 5]
splits:
  - [G1, instruction]
  - [G1, tool]
  - [G1, category]
  - [G2, instruction]
  - [G2, category]
  - [G3, instruction]
