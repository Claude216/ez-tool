# Isolate the tokenizer from the scoring library inside the S0 -> S1 jump.
#
# S0  = BM25Okapi + nltk tokens        (their stack)          -> 26.22 I1@5
# S0b = BM25Okapi + regex tokens       (this run)
# S1  = bm25s robertson + regex tokens (already measured)      -> 39.13 I1@5
#
# If S0b lands near S1, the tokenizer is the cause. If it lands near S0, the
# scoring library is.
run_name: toolbench_isolate
data_root: /mnt/beegfs/lli66/ez-tool/data/raw/toolgen_data/data/retrieval
settings: [multi_domain]
retrievers:
  - name: S0b_okapi_regex_tokens
    type: bm25_okapi
    k1: 1.5
    b: 0.75
    epsilon: 0.25
    tokenizer: regex
top_k: 100
ks: [1, 3, 5]
splits:
  - [G1, instruction]
  - [G1, tool]
  - [G1, category]
  - [G2, instruction]
  - [G2, category]
  - [G3, instruction]
